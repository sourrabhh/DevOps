services:
  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    networks:
      - mern-network

  # Backend Service
  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - 5050:5050
    networks:
      - mern-network
    depends_on:
      - db

  # Database service
  db:
    image: mongo
    ports:
      - 27017:27017
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local